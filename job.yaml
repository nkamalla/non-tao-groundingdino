$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

code: .

command: >
  python train.py 
  --data-path ${{inputs.dataset}}
  --output-dir ${{outputs.outputs}}

environment: azureml:gdino_ubuntu_gpu_enabled@latest
compute: TAO-TeamCluster

inputs:
  dataset:
    type: uri_folder
    path: azureml:URPC2020_G_DINO@latest

outputs:
  outputs:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/TAO_G_DINO/urpc2020_G_DINO_v1/withouttao/

resources:
  instance_count: 1
  shm_size: '16g'

distribution:
  type: pytorch
  process_count_per_instance: 1